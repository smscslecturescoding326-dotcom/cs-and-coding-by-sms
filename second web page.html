<!DOCTYPE html>

<html>

<head>

<title>Second Webpage</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
 *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0a0a23,#16163b);
color:white;
}

#loader{
position:fixed;
width:100%;
height:100%;
background:#0a0a23;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.spinner{
width:70px;
height:70px;
border:8px solid rgba(255,255,255,.2);
border-top:8px solid orange;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

#main{
display:none;
animation:fadePage 1s ease;
}

@keyframes fadePage{
from{
opacity:0;
}
to{
opacity:1;
}
}

.header{
padding:30px;
background:#11112c;
display:flex;
justify-content:flex-start;
align-items:center;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
border:4px solid orange;
object-fit:cover;
animation:
logoEnter 1.5s ease,
logoGlow 2s infinite alternate;
}

@keyframes logoEnter{
0%{
opacity:0;
transform:scale(.2) rotate(-180deg);
}
100%{
opacity:1;
transform:scale(1) rotate(0deg);
}
}

@keyframes logoGlow{
from{
box-shadow:0 0 15px orange;
}
to{
box-shadow:0 0 50px orange;
}
}

.content{
max-width:1000px;
margin:auto;
padding:40px;
text-align:center;
}

.title{
display:flex;
align-items:center;
gap:20px;
}

.title hr{
flex:1;
border:1px solid orange;
}

h1{
color:orange;
line-height:1.6;
animation:titleAnimation 2s ease;
}

@keyframes titleAnimation{
0%{
opacity:0;
transform:translateY(80px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

hr{
margin:30px 0;
border-color:orange;
}

.buttons{
display:flex;
justify-content:space-between;
margin-top:80px;
gap:20px;
}

.nav-btn{
padding:18px 40px;
background:linear-gradient(90deg,orange,#ffb347);
color:black;
text-decoration:none;
font-weight:bold;
font-size:20px;
border-radius:60px;
transition:.3s;
}

.nav-btn:hover{
transform:translateY(-5px) scale(1.05);
}

/* Mobile */

@media (max-width:768px){

.header{
justify-content:center;
padding:20px;
}

.logo{
width:180px;
height:180px;
}

.content{
padding:25px;
}

.title{
flex-direction:column;
gap:15px;
}

h1{
font-size:34px;
line-height:1.5;
}

.buttons{
flex-direction:column;
margin-top:50px;
}

.nav-btn{
width:100%;
padding:20px;
font-size:24px;
}

}
</style>

</head>

<body>

<div id="loader">

<div class="spinner"></div>

</div>

<div id="main">

<div class="header">

<img src="logo.png" class="logo">

</div>

<div class="content">

<br>

<hr>

<br>

<div class="title">

<hr>

<h1>

Computer Science
<br>

Class 9th
<br>

Khyber Pakhtunkhwa Board

</h1>

<hr>

</div>

<br><br><br>

<hr>

<div class="buttons">

<a href="home.html"
class="nav-btn">

← Previous

</a>

<a href="third web page.html"
class="nav-btn">

Next →

</a>

</div>

</div>

</div>

<script>

window.onload=function(){

setTimeout(function(){

document.getElementById("loader")
.style.display="none";

document.getElementById("main")
.style.display="block";

},1500);

}

</script>

</body>

</html>
