<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="icon"
href="logo.png">

<title>CS & Coding by SMS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

min-height:100vh;

background:
radial-gradient(
circle at top,
#1a1a50,
#050515
);

overflow-x:hidden;

}

/* NAVBAR */

nav{

display:flex;

justify-content:space-between;

align-items:flex-start;

padding:30px 70px;

}

/* LEFT */

.left{

display:flex;

align-items:center;

margin-top:50px;

}

/* LOGO */

.logo{

width:220px;

height:220px;

object-fit:cover;

border-radius:50%;

border:8px solid orange;

box-shadow:

0 0 30px orange,

0 0 70px rgba(255,165,0,.6),

0 0 120px rgba(255,165,0,.4);

transition:.4s;

}

.logo:hover{

transform:
rotate(8deg)
scale(1.05);

}

/* TITLE */

.title{

margin-left:35px;

font-size:64px;

font-weight:bold;

color:orange;

text-shadow:

0 0 15px orange;

}

/* MENU */

.menu{

margin-top:35px;

}

.menu a{

text-decoration:none;

color:orange;

font-size:24px;

margin-left:35px;

font-weight:bold;

}

.menu a:hover{

color:white;

}

/* HERO */

.hero{

text-align:center;

padding:80px 25px;

}

.hero h1{

font-size:85px;

color:orange;

margin-top:50px;

text-shadow:

0 0 20px orange;

}

.hero p{

font-size:28px;

color:#ffd89e;

margin-top:35px;

line-height:50px;

}

/* FOOTER */

footer{

text-align:center;

color:orange;

padding:35px;

font-size:18px;

}

/* MOBILE */

@media(max-width:768px){

nav{

flex-direction:column;

align-items:center;

}

.left{

flex-direction:column;

margin-top:20px;

}

.logo{

width:260px;

height:260px;

}

.title{

font-size:42px;

text-align:center;

margin-left:0;

margin-top:25px;

}

.menu{

margin-top:30px;

}

.menu a{

display:block;

margin:18px;

}

.hero h1{

font-size:48px;

}

.hero p{

font-size:20px;

line-height:35px;

}

}

</style>

</head>

<body>

<nav>

<div class="left">

<img
src="logo.png"
class="logo">

<div class="title">

CS & Coding

</div>

</div>

<div class="menu">

<a href="index.html">
Home
</a>

<a href="about.html">
About
</a>

<a href="contact.html">
Contact
</a>

</div>

</nav>

<section class="hero">

<h1>

WELCOME

</h1>

<p>

Learn Computer Science<br>

Coding & Technology<br>

With CS & Coding By SMS

</p>

</section>

<footer>

© 2026 CS & Coding by SMS

</footer>

</body>

</html>
