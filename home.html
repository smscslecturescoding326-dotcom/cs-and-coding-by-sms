<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>
<link rel="icon" type="image/png" href="logo.png">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0a0a23,#16163b);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
width:100%;
padding:40px;
}

.logo{
width:170px;
height:170px;
object-fit:cover;
border-radius:50%;
border:5px solid orange;
box-shadow:0 0 40px rgba(255,165,0,.5);
margin-bottom:25px;
}

h1{
color:white;
font-size:60px;
margin-bottom:35px;
}

.btn{
display:inline-block;
padding:18px 40px;
background:orange;
color:black;
text-decoration:none;
font-size:22px;
font-weight:bold;
border-radius:50px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* Mobile */

@media (max-width:768px){

.container{
padding:25px;
}

.logo{
width:220px;
height:220px;
}

h1{
font-size:42px;
}

.btn{
font-size:26px;
padding:20px 45px;
}

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Welcome</h1>

<a href="second web page.html" class="btn">
Get Started
</a>

</div>

</body>

</html>
