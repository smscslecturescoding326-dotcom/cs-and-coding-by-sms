<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#0a0a23,#16163b);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.container{
max-width:800px;
padding:40px;
}

.logo{
width:170px;
height:170px;
object-fit:cover;
border-radius:50%;
border:5px solid orange;
box-shadow:0 0 40px rgba(255,165,0,.5);
margin-bottom:25px;
}

h1{
color:white;
font-size:60px;
margin-bottom:35px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:orange;
color:black;
text-decoration:none;
font-size:18px;
font-weight:bold;
border-radius:50px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Welcome</h1>

<a href="file:///F:/Languages/HTML/My%20website/second%20web%20page.html" class="btn">
Get Started
</a>

</div>

</body>

</html>
