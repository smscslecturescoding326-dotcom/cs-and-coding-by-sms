<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - CS & Coding by SMS</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

:root{
  --bg1:#050816;
  --bg2:#0a1024;
  --bg3:#101a38;
  --card:rgba(16,22,42,.62);
  --text:#f8fbff;
  --muted:#d7e2f1;
  --accent:#ff9a1f;
  --accent2:#ff6a00;
  --accent3:#ffd08a;
}

body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 18% 18%, rgba(255,154,31,.18), transparent 14%),
    radial-gradient(circle at 82% 14%, rgba(255,106,0,.11), transparent 18%),
    linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
}

/* NAV (same as home) */
header{
  padding:24px 60px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
  border-radius:28px;
  background:rgba(8,12,26,.68);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.10);
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:76px;
  height:76px;
  border-radius:50%;
  border:3px solid rgba(255,154,31,.95);
  object-fit:cover;
}

.menu a{
  text-decoration:none;
  color:white;
  padding:10px 14px;
  margin-left:10px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);
}

.menu a:hover{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:black;
}

/* HERO */
.hero{
  padding:50px 60px;
}

.hero-box{
  max-width:1100px;
  margin:auto;
  padding:40px;
  border-radius:32px;
  background:
    linear-gradient(135deg, rgba(255,154,31,.12), transparent 35%),
    linear-gradient(180deg, rgba(17,24,44,.80), rgba(11,16,31,.72));
  border:1px solid rgba(255,255,255,.10);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  margin-top:20px;
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

input, textarea{
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:white;
  outline:none;
}

textarea{
  min-height:120px;
  resize:none;
}

button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:700;
  cursor:pointer;
}

button:hover{
  transform:translateY(-2px);
}

/* INFO BOX */
.info{
  padding:20px;
  border-radius:20px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.10);
}

.info h3{
  color:var(--accent3);
  margin-bottom:10px;
}

.info p{
  color:var(--muted);
  line-height:1.7;
  margin-bottom:10px;
}

/* FOOTER */
footer{
  margin-top:60px;
  text-align:center;
  padding:20px;
  color:var(--muted);
  border-top:1px solid rgba(255,255,255,.08);
}

/* MOBILE */
@media(max-width:900px){
  header,.hero{
    padding:20px;
  }
  .grid{
    grid-template-columns:1fr;
  }
  .nav{
    flex-direction:column;
    gap:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">
      <img src="logo.png" class="logo">
      <h2>CS & Coding by SMS</h2>
    </div>

    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="Courses.html">Courses</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-box">

    <h1>Contact Us</h1>
    <p style="color:#d7e2f1;margin-top:10px;">
      Send your message, feedback, or questions. We reply as soon as possible.
    </p>

    <div class="grid">

      <!-- FORM -->
      <form>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Your Message"></textarea>
        <button type="submit">Send Message</button>
      </form>

      <!-- INFO -->
      <div class="info">
        <h3>📩 Contact Info</h3>
        <p>Email: cscodingbysms@gmail.com</p>
        <p>YouTube: CS Coding by SMS</p>
        <p>Response time: 24–48 hours</p>
      </div>

    </div>

  </div>
</section>

<footer>
  © 2026 CS & Coding by SMS
</footer>

</body>
</html>
